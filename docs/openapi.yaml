openapi: 3.0.0
info:
  title: Habit Life RPG API
  version: 1.0.0
  description: API contract for the Habit Life RPG MVP described in Chapter 4.
  license:
    name: Private educational sample
    url: https://github.com/eric861129/Habit-Life-RPG
servers:
  - url: /
    description: Relative API root. Local and cloud hosts are configured outside the contract.
tags:
  - name: User
    description: Player profile and RPG status.
  - name: Habits
    description: Habit list and check-in operations.
paths:
  /api/v1/user/profile:
    get:
      tags:
        - User
      summary: Get current user profile
      description: Returns the authenticated user's player status for the frontend Hero Status panel.
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              example:
                id: 1
                username: arthur
                level: 2
                exp: 120
                gold: 35
                hp: 86
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/habits:
    get:
      tags:
        - Habits
      summary: List current user's habits
      description: Returns the authenticated user's habits for the Quest Log UI.
      operationId: listCurrentUserHabits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of habits owned by the current user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
              example:
                - id: 1
                  title: 晨間 20 分鐘閱讀
                  category: Mind
                  last_check_in: null
                  checked_in_today: false
                - id: 2
                  title: 喝水 2000 ml
                  category: Body
                  last_check_in: "2026-06-16T08:10:00+08:00"
                  checked_in_today: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/habits/{habit_id}/checkin:
    post:
      tags:
        - Habits
      summary: Check in a habit
      description: Checks in one habit, applies server-side rewards, and returns the updated player status.
      operationId: checkInHabit
      security:
        - bearerAuth: []
      parameters:
        - name: habit_id
          in: path
          required: true
          description: The habit id owned by the current user.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Habit check-in succeeded and player status was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCheckinResponse"
              example:
                habit_id: 1
                checked_in: true
                current_exp: 160
                current_gold: 43
                current_level: 2
                leveled_up: false
        "400":
          description: The habit was already checked in today.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Habit already checked in today.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The habit does not belong to the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: You do not have permission to check in this habit.
        "404":
          description: The habit id does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Habit not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Development JWT bearer token. Chapter 5 defines the concrete auth implementation.
  responses:
    Unauthorized:
      description: Missing, invalid, or expired authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            detail: Not authenticated.
  schemas:
    UserProfile:
      type: object
      required:
        - id
        - username
        - level
        - exp
        - gold
        - hp
      properties:
        id:
          type: integer
          minimum: 1
          description: User id.
        username:
          type: string
          description: Unique username.
        level:
          type: integer
          minimum: 1
          description: Current player level.
        exp:
          type: integer
          minimum: 0
          description: Current player experience.
        gold:
          type: integer
          minimum: 0
          description: Current player gold.
        hp:
          type: integer
          minimum: 0
          maximum: 100
          description: Current player HP.
    Habit:
      type: object
      required:
        - id
        - title
        - category
        - last_check_in
        - checked_in_today
      properties:
        id:
          type: integer
          minimum: 1
          description: Habit id.
        title:
          type: string
          description: Habit title shown in the Quest Log UI.
        category:
          type: string
          nullable: true
          description: Habit category such as Mind, Body, or Craft.
        last_check_in:
          type: string
          format: date-time
          nullable: true
          description: Most recent check-in timestamp.
        checked_in_today:
          type: boolean
          description: Whether this habit has already been checked in today.
    HabitCheckinResponse:
      type: object
      required:
        - habit_id
        - checked_in
        - current_exp
        - current_gold
        - current_level
        - leveled_up
      properties:
        habit_id:
          type: integer
          minimum: 1
          description: Habit id that was checked in.
        checked_in:
          type: boolean
          description: True when the check-in was accepted.
        current_exp:
          type: integer
          minimum: 0
          description: Updated player experience after check-in.
        current_gold:
          type: integer
          minimum: 0
          description: Updated player gold after check-in.
        current_level:
          type: integer
          minimum: 1
          description: Updated player level after check-in.
        leveled_up:
          type: boolean
          description: Whether the check-in caused a level increase.
    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Human-readable error message.
