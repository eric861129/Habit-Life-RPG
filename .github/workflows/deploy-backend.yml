name: Deploy HLR backend

on:
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: Build and scan only when false; deploy the verified image to Azure when true.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hlr-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/habit-life-rpg-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check backend tests scripts
      - run: python -m pytest -q

  build-image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Select immutable image reference
        id: image
        shell: bash
        run: echo "image_ref=${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: Report all High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          scanners: vuln
      - name: Block fixable High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln
          skip-setup-trivy: true
      - name: Block secrets in the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          scanners: secret
          skip-setup-trivy: true

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.deploy_to_azure }}
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-demo
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
    steps:
      - uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the immutable image
        shell: bash
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --image "$IMAGE_REF" \
            --revision-suffix "${GITHUB_SHA::8}" \
            --output none \
            --only-show-errors
      - name: Verify liveness and readiness
        shell: bash
        run: |
          fqdn="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv \
            --only-show-errors)"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "https://${fqdn}/health/live" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 "https://${fqdn}/health/ready" >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          echo "Container Apps health verification did not pass." >&2
          exit 1
