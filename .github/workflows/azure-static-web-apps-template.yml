name: Azure Static Web Apps Template

on:
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Deploy placeholder
        run: |
          echo "Configure Azure Static Web Apps deployment token before enabling deployment."
          echo "This template is intentionally manual-only for the book checkpoint."
