[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-life-rpg"
version = "0.2.0"
description = "Cumulative sample project for Left Blueprint, Right Magic."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
